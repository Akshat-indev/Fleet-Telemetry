server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; re-resolve so an api container restart
    # (new IP) never leaves nginx proxying to a dead address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # SSE: no buffering, long-lived reads, HTTP/1.1 keepalive.
    location /v1/stream {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /v1/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location = /health  { proxy_pass $api; }
    location = /ready   { proxy_pass $api; }
    location = /metrics { proxy_pass $api; }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}