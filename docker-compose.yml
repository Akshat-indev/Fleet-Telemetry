services:
  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fleet}:${POSTGRES_PASSWORD:-fleet}@db:5432/${POSTGRES_DB:-fleet}
      OFFLINE_AFTER_SECONDS: ${OFFLINE_AFTER_SECONDS:-90}
      OFFLINE_CHECK_INTERVAL_SECONDS: ${OFFLINE_CHECK_INTERVAL_SECONDS:-15}
      DISCHARGE_DROP_PCT: ${DISCHARGE_DROP_PCT:-8}
      DISCHARGE_WINDOW_SECONDS: ${DISCHARGE_WINDOW_SECONDS:-300}
      GEOFENCE_POLYGON: ${GEOFENCE_POLYGON:-[[12.8,79.9],[13.3,79.9],[13.3,80.5],[12.8,80.5]]}
      AUTH_TIMESTAMP_WINDOW_SECONDS: ${AUTH_TIMESTAMP_WINDOW_SECONDS:-300}
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY:-120}
      RATE_LIMIT_REFILL_PER_SECOND: ${RATE_LIMIT_REFILL_PER_SECOND:-20.0}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  simulator:
    build: .
    profiles: ["simulation"]
    # Entrypoint carries the interpreter so `compose run simulator --vehicles N`
    # (args override `command`) still launches the simulator instead of trying
    # to exec the first flag as a binary.
    entrypoint: ["python", "-m", "simulator", "--api-base", "http://api:8000"]
    command: >
      --vehicles ${SIM_VEHICLES:-2000}
      --duration ${SIM_DURATION:-60}
      --interval ${SIM_INTERVAL:-5}
      --batch-size ${SIM_BATCH_SIZE:-250}
      --concurrency ${SIM_CONCURRENCY:-8}
      --seed ${SIM_SEED:-42}
    environment:
      SIM_API_KEY: ${SIM_API_KEY:-}
      SIM_API_SECRET: ${SIM_API_SECRET:-}
      SIM_VALID_PCT: ${SIM_VALID_PCT:-60}
      SIM_INVALID_PCT: ${SIM_INVALID_PCT:-40}
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet}
      POSTGRES_DB: ${POSTGRES_DB:-fleet}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleet} -d ${POSTGRES_DB:-fleet}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: